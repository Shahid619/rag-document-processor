[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-processor"
version = "0.1.0"
description = "Production-ready RAG system for document processing and semantic search"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Shahid Khan", email = "shahid@example.com"}
]
keywords = ["rag", "retrieval-augmented-generation", "llm", "langchain", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.1",
    "langchain-openai>=0.0.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "chroma-db>=0.4.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

vector-stores = [
    "pinecone-client>=3.0.0",
    "weaviate-client>=4.0.0",
    "faiss-cpu>=1.7.4",
]

embeddings = [
    "sentence-transformers>=2.2.0",
    "huggingface-hub>=0.16.0",
]

llms = [
    "anthropic>=0.7.0",
]

all = [
    "rag-document-processor[dev,vector-stores,embeddings,llms]"
]

[project.urls]
Homepage = "https://github.com/Shahid619/rag-document-processor"
Documentation = "https://github.com/Shahid619/rag-document-processor/wiki"
Repository = "https://github.com/Shahid619/rag-document-processor.git"
Issues = "https://github.com/Shahid619/rag-document-processor/issues"

[tool.setuptools]
packages = ["rag_processor"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["rag_processor"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]